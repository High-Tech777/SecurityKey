<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="passkeyed">
  <title>passkeyed</title>
  <!-- A fingerprint behind a shield: the credential is something you are,
       held on your own device, and the app only ever sees the proof. The
       ridges are in red, the colour of the Rails side that checks them.

       The fingerprint is Lucide's glyph (ISC). The tile, its radius and its
       ground are the same as the other marks on pardel.dev. -->
  <rect width="512" height="512" rx="112" fill="#0f172a"/>
  <path d="M256 84l136 52v104c0 92-58 158-136 190c-78-32-136-98-136-190V136z" fill="none" stroke="#e2e8f0" stroke-width="30" stroke-linejoin="round"/>
  <g transform="translate(172 170) scale(7)" fill="none" stroke="#ef4444" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 12a10 10 0 0 1 18-6"/>
    <path d="M21.8 16c.2-2 .131-5.354 0-6"/>
    <path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/>
    <path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/>
    <path d="M9 6.8a6 6 0 0 1 9 5.2v2"/>
    <path d="M8.65 22c.21-.66.45-1.32.57-2"/>
    <path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/>
    <path d="M14 13.12c0 2.38 0 6.38-1 8.88"/>
  </g>
</svg>
